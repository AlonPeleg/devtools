<!-- Apply saved settings before first paint (no theme flash) -->
<script>
(function () {
    try {
        var root = document.documentElement;
        var raw = localStorage.getItem('dev_toolkit_settings_v1');
        var s = raw ? JSON.parse(raw) : null;
        var g = (s && s.general) || {};
        var theme = g.theme;
        if (theme !== 'light' && theme !== 'dark') {
            var old = !s ? localStorage.getItem('dev_toolkit_theme_v1') : null;   // pre-settings versions stored an explicit choice
            theme = (old === 'light' || old === 'dark') ? old
                  : (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        }
        root.setAttribute('data-theme', theme);
        if (g.contrast === 'high') root.setAttribute('data-hc', '1');
        if (g.motion === 'reduce' || g.motion === 'full') root.setAttribute('data-motion', g.motion);
        if (g.splash === false) root.setAttribute('data-splash', 'off');
        var scale = [90, 100, 110, 125, 150].indexOf(Number(g.uiScale)) >= 0 ? Number(g.uiScale) / 100 : 1;
        root.style.setProperty('--ui-scale', scale);
        root.style.fontSize = (16 * scale) + 'px';
    } catch (e) {}
})();
</script>

  :root {
    --bg: #1e1e1e;
    --bar-bg: #252526;
    --bar-border: #3c3c3c;
    --elev: #2d2d30;
    --input: #3c3c3c;
    --text: #cccccc;
    --text-dim: #9a9a9a;
    --text-bright: #ffffff;
    --tab-fg: #969696;
    --tab-fg-active: #ffffff;
    --tab-active-bg: #1e1e1e;
    --accent: #007acc;
    --accent-strong: #0e8fd9;
    --accent-fg: #ffffff;
    --focus: #3aa0ff;
    --hover: rgba(128,128,128,0.18);
    --shadow: rgba(0,0,0,0.55);
    --backdrop: rgba(0,0,0,0.5);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: "Cascadia Code", "SF Mono", Consolas, "Courier New", monospace;
    /* Opposite of the current background so the brand cursor always pops against the bar. */
    --cursor-color: #ffffff;
    --ui-scale: 1;
    --tok-comment: #6a9955; --tok-string: #ce9178; --tok-keyword: #569cd6; --tok-number: #b5cea8;
    --tok-type: #4ec9b0;    --tok-func: #dcdcaa;   --tok-key: #9cdcfe;
    --dot-code: #3ba7ff; --dot-json: #e2b93d; --dot-xlsx: #3fae5a;
  }
  html[data-theme="light"] {
    --bg: #ffffff;
    --bar-bg: #f3f3f3;
    --bar-border: #d4d4d4;
    --elev: #ececec;
    --input: #e8e8e8;
    --text: #1e1e1e;
    --text-dim: #5f5f5f;
    --text-bright: #000000;
    --tab-fg: #5f5f5f;
    --tab-fg-active: #000000;
    --tab-active-bg: #ffffff;
    --accent: #086bb3;
    --accent-strong: #086bb3;
    --focus: #086bb3;
    --shadow: rgba(0,0,0,0.2);
    --backdrop: rgba(0,0,0,0.3);
    --cursor-color: #000000;
    --tok-comment: #008000; --tok-string: #a31515; --tok-keyword: #0000ff; --tok-number: #098658;
    --tok-type: #267f99;    --tok-func: #795e26;   --tok-key: #001080;
  }
  /* High contrast: brighter text, firmer borders. */
  html[data-hc="1"]:not([data-theme="light"]) {
    --text: #ffffff; --text-dim: #d6d6d6; --tab-fg: #d6d6d6; --bar-border: #9a9a9a;
    --accent: #3db4ff; --accent-strong: #3db4ff; --focus: #ffd54a; --input: #1e1e1e;
  }
  html[data-hc="1"][data-theme="light"] {
    --text: #000000; --text-dim: #2b2b2b; --tab-fg: #2b2b2b; --bar-border: #4a4a4a;
    --accent: #0a4f8a; --accent-strong: #0a4f8a; --focus: #7a2e00; --input: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; background: var(--bg); color: var(--text);
    font-family: var(--font-ui);
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
  button { font-family: inherit; }

  #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

  /* ---------- Tab bar ---------- */
  #tabbar {
    display: flex; align-items: stretch;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-border);
    flex: 0 0 auto;
    padding-left: 0.5rem;
    min-height: 2.5rem;
  }
  #tabbar .brand {
    display: flex; align-items: center; margin: 0;
    color: var(--text); font-weight: 600; font-size: 0.8125rem;
    padding: 0 0.875rem 0 0.25rem; letter-spacing: 0.2px; white-space: nowrap;
  }
  #tabbar .brand::after {
    content: "_"; color: var(--cursor-color);
    text-shadow: 0 0 6px var(--cursor-color);
    margin-left: 2px;
    animation: brandCursorBlink 1.1s steps(1) infinite;
  }
  @keyframes brandCursorBlink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    html:not([data-motion="full"]) #tabbar .brand::after { animation: none; }
  }
  html[data-motion="reduce"] #tabbar .brand::after { animation: none; }

  .tabs {
    display: flex; align-items: stretch; min-width: 0; flex: 0 1 auto;
    overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 0.5rem; flex: 0 0 auto;
    padding: 0.625rem 1.125rem; font-size: 0.8125rem;
    color: var(--tab-fg); background: transparent; border: none;
    border-right: 1px solid var(--bar-border);
    cursor: pointer; position: relative; top: 1px; white-space: nowrap;
  }
  .tab:hover { color: var(--text); background: rgba(128,128,128,0.10); }
  .tab[aria-selected="true"] {
    color: var(--tab-fg-active); background: var(--tab-active-bg);
    border-bottom: 1px solid var(--tab-active-bg);
  }
  .tab[aria-selected="true"]::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent);
  }
  .tab .dot { width: 0.5rem; height: 0.5rem; border-radius: 2px; flex: 0 0 auto; }
  .tab[data-tool="code"] .dot { background: var(--dot-code); }
  .tab[data-tool="json"] .dot { background: var(--dot-json); }
  .tab[data-tool="xlsx"] .dot { background: var(--dot-xlsx); }

  .bar-actions { margin-left: auto; display: flex; align-items: center; gap: 0.125rem; padding: 0 0.625rem 0 0.5rem; flex: 0 0 auto; }
  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    background: transparent; border: none; cursor: pointer; text-decoration: none;
    color: var(--tab-fg); padding: 0.375rem; border-radius: 4px;
  }
  .icon-btn:hover { background: var(--hover); color: var(--tab-fg-active); }
  .icon-btn svg { width: 1rem; height: 1rem; display: block; }

  /* ---------- Panes ---------- */
  #panes { position: relative; flex: 1 1 auto; min-height: 0; background: var(--bg); overflow: hidden; }
  .pane { position: absolute; inset: 0; display: none; overflow: hidden; }
  .pane.active { display: block; }
  /* "Interface size" scales each tool like browser zoom: the frame is laid out at 1/scale and scaled back up. */
  .pane iframe {
    width: calc(100% / var(--ui-scale)); height: calc(100% / var(--ui-scale));
    transform: scale(var(--ui-scale)); transform-origin: 0 0;
    border: none; display: block; background: #fff;
  }
  .placeholder { height: 100%; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 0.8125rem; }

  /* ---------- Welcome screen ---------- */
  #splash {
    position: absolute; inset: 0; z-index: 50; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
    padding: 1rem; cursor: pointer; outline: none; transition: opacity 0.18s;
  }
  #splash img {
    display: block; max-width: min(100%, 1200px); max-height: calc(100% - 3.5rem); width: auto; height: auto;
    border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.55); user-select: none; -webkit-user-drag: none;
  }
  #splash .splash-foot { display: flex; gap: 1.5rem; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 0.8125rem; color: var(--text-dim); }
  #splash .splash-gh { color: var(--accent-strong); text-decoration: none; padding: 0.25rem 0.5rem; border-radius: 4px; }
  #splash .splash-gh:hover { text-decoration: underline; }
  #splash:focus-visible .splash-hint { text-decoration: underline; }
  html[data-theme="light"] #splash img { box-shadow: 0 16px 48px rgba(0,0,0,0.18); border: 1px solid var(--bar-border); }
  #splash.hide { opacity: 0; pointer-events: none; }
  #staleNotice {
    position: fixed; left: 0.75rem; bottom: 0.75rem; z-index: 2000; max-width: min(34rem, calc(100vw - 1.5rem));
    display: flex; gap: 0.75rem; align-items: flex-start; padding: 0.625rem 0.75rem; border-radius: 6px;
    background: #5a1e1e; color: #fff; border: 1px solid #c0504d; box-shadow: 0 6px 24px rgba(0,0,0,0.45); font-size: 0.75rem; line-height: 1.45;
  }
  #staleNotice b { display: block; margin-bottom: 2px; font-size: 0.8125rem; }
  #staleNotice .btn { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.35); flex: 0 0 auto; }
  html[data-splash="off"] #splash { display: none; }
  html[data-motion="reduce"] #splash { transition: none; }
  @media (prefers-reduced-motion: reduce) { html:not([data-motion="full"]) #splash { transition: none; } }

  /* ---------- Overlays (palette, settings) ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 1000; background: var(--backdrop);
    display: flex; justify-content: center; align-items: flex-start; padding: 12vh 1rem 1rem;
  }
  .overlay[hidden] { display: none; }
  .overlay.center { align-items: center; padding: 1rem; }
  .dialog {
    background: var(--bar-bg); color: var(--text); border: 1px solid var(--bar-border);
    border-radius: 8px; box-shadow: 0 12px 40px var(--shadow);
    max-width: 100%; display: flex; flex-direction: column; min-height: 0;
  }

  /* Command palette */
  #palette .dialog { width: 34rem; max-height: 70vh; }
  .pal-input-wrap { padding: 0.625rem; border-bottom: 1px solid var(--bar-border); }
  .pal-input {
    width: 100%; background: var(--input); color: var(--text-bright);
    border: 1px solid transparent; border-radius: 4px; padding: 0.5rem 0.625rem;
    font-size: 0.875rem; font-family: inherit; outline: none;
  }
  .pal-input:focus { border-color: var(--focus); }
  .pal-list { list-style: none; margin: 0; padding: 0.25rem; overflow-y: auto; min-height: 0; }
  .pal-item {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 0.4375rem 0.625rem; border-radius: 4px; cursor: pointer; font-size: 0.8125rem;
  }
  .pal-item[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
  .pal-item kbd, .kbd {
    font-family: var(--font-mono); font-size: 0.6875rem; padding: 0.0625rem 0.375rem;
    border: 1px solid var(--bar-border); border-radius: 3px; background: var(--bg); color: var(--text-dim);
    white-space: nowrap;
  }
  .pal-item[aria-selected="true"] kbd { background: rgba(255,255,255,0.18); color: #fff; border-color: rgba(255,255,255,0.35); }
  .pal-empty { padding: 1rem; text-align: center; color: var(--text-dim); font-size: 0.8125rem; }
  .pal-foot { padding: 0.375rem 0.75rem; border-top: 1px solid var(--bar-border); font-size: 0.6875rem; color: var(--text-dim); display: flex; gap: 1rem; }

  /* Settings */
  #settings .dialog { width: 58rem; height: min(40rem, calc(100vh - 2rem)); }
  .dlg-head { display: flex; align-items: center; justify-content: space-between; padding: 0.625rem 0.75rem 0.625rem 1rem; border-bottom: 1px solid var(--bar-border); }
  .dlg-head h2 { margin: 0; font-size: 0.9375rem; font-weight: 600; color: var(--text-bright); }
  .dlg-body { display: grid; grid-template-columns: 10.5rem minmax(0, 1fr); flex: 1 1 auto; min-height: 0; }
  .set-nav { display: flex; flex-direction: column; gap: 2px; padding: 0.625rem; border-right: 1px solid var(--bar-border); }
  .set-nav button {
    display: flex; align-items: center; gap: 0.5rem; text-align: left;
    background: transparent; border: none; color: var(--text); cursor: pointer;
    padding: 0.5rem 0.625rem; border-radius: 4px; font-size: 0.8125rem;
  }
  .set-nav button:hover { background: var(--hover); }
  .set-nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
  .set-nav .dot { width: 0.5rem; height: 0.5rem; border-radius: 2px; background: var(--text-dim); flex: 0 0 auto; }
  .set-nav [data-sec="code"] .dot { background: var(--dot-code); }
  .set-nav [data-sec="json"] .dot { background: var(--dot-json); }
  .set-nav [data-sec="xlsx"] .dot { background: var(--dot-xlsx); }
  .set-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; padding: 1rem; min-height: 0; overflow: hidden; }
  .set-controls { overflow-y: auto; min-height: 0; padding-right: 0.5rem; }
  .set-preview-col { min-height: 0; display: flex; flex-direction: column; gap: 0.5rem; }
  .set-preview-title { font-size: 0.75rem; font-weight: 600; color: var(--text-dim); margin: 0; }
  .set-preview-note { font-size: 0.6875rem; color: var(--text-dim); margin: 0; }
  .dlg-foot { display: flex; align-items: center; gap: 0.5rem; padding: 0.625rem 1rem; border-top: 1px solid var(--bar-border); font-size: 0.75rem; color: var(--text-dim); }
  .dlg-foot .spacer { flex: 1; }

  #storageBox, #shortcutsBox { margin-top: 1rem; }
  .grp { margin: 0 0 0.25rem; font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.4px; color: var(--text-dim); padding: 0.25rem 0 0.375rem; border-bottom: 1px solid var(--bar-border); }
  .grp:not(:first-child) { margin-top: 1rem; }
  .ctl { padding: 0.625rem 0 0.125rem; }
  .ctl > label, .ctl > .lbl { display: block; font-size: 0.8125rem; font-weight: 600; color: var(--text-bright); margin-bottom: 0.375rem; }
  .ctl .help { font-size: 0.6875rem; color: var(--text-dim); margin: 0.375rem 0 0; line-height: 1.4; }
  .seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--bar-border); border-radius: 5px; overflow: hidden; }
  .seg button {
    background: var(--bg); color: var(--text); border: none; border-right: 1px solid var(--bar-border);
    padding: 0.3125rem 0.75rem; font-size: 0.75rem; cursor: pointer;
  }
  .seg button:last-child { border-right: none; }
  .seg button:hover { background: var(--hover); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .field, select.field {

      [MOD + '+,', 'Open settings'],
      ['Esc', 'Close a dialog']
    ].forEach(function (r) { dl.appendChild(h('dt', { text: r[1] })); dl.appendChild(h('dd', {}, [h('kbd', { class: 'kbd', text: r[0] })])); });
    box.appendChild(h('div', { class: 'ctl' }, [dl,
      h('p', { class: 'help', text: 'Some browsers reserve Ctrl/⌘ + number for their own tabs. If that’s the case, use the command palette or click a tab.' })]));
    return box;
  }

  function renderControls() {
    var box = $('setControls'), focusFk = document.activeElement && document.activeElement.getAttribute && document.activeElement.getAttribute('data-fk');
    var scrollTop = box.scrollTop;
    box.innerHTML = '';
    SCHEMA[section].forEach(function (spec) {
      if (spec.group) box.appendChild(h('div', { class: 'grp', text: spec.group }));
      else if (spec.custom === 'storage') box.appendChild(buildStorage());
      else if (spec.custom === 'shortcuts') box.appendChild(buildShortcuts());
      else box.appendChild(buildControl(spec, section));
    });
    box.setAttribute('aria-labelledby', 'setnav-' + section);
    box.scrollTop = scrollTop;
    if (focusFk) { var el = box.querySelector('[data-fk="' + focusFk + '"]'); if (el) el.focus(); }
    if (pendingScroll) { var t = $(pendingScroll + 'Box'); if (t) t.scrollIntoView({ block: 'start' }); pendingScroll = null; }
  }

  function renderNav() {
    var nav = $('setNav');
    nav.innerHTML = '';
    SECTIONS.forEach(function (s) {
      nav.appendChild(h('button', {
        type: 'button', role: 'tab', id: 'setnav-' + s[0], 'data-sec': s[0], 'aria-selected': s[0] === section ? 'true' : 'false',
        onclick: function () { section = s[0]; renderNav(); renderControls(); renderPreview(); }
      }, [h('span', { class: 'dot' }), s[1]]));
    });
  }

  /* ---------- Previews ---------- */
  var SAMPLE_JSON = {
    name: 'dev-toolkit', version: '1.4.0', private: false,
    tags: ['json', 'xml', 'csv'],
    author: { name: 'Alon', links: { github: 'AlonPeleg', site: 'devtools' } },
    scripts: { build: 'vite build', test: 'vitest run' }
  };
  function pvScalar(v) {
    if (typeof v === 'string') return '<span class="pv-str">"' + esc(v) + '"</span>';
    if (typeof v === 'number') return '<span class="pv-num">' + v + '</span>';
    return '<span class="pv-bool">' + v + '</span>';
  }
  function pvNode(key, val, depth, levels) {
    var isObj = val && typeof val === 'object', isArr = Array.isArray(val);
    var k = key == null ? '' : '<span class="pv-key">"' + esc(key) + '"</span>: ';
    if (!isObj) return '<div class="pv-line"><span class="pv-tg"></span>' + k + pvScalar(val) + '</div>';
    var keys = Object.keys(val), lb = isArr ? '[' : '{', rb = isArr ? ']' : '}';
    var open = depth === 0 || levels === 'all' || depth < Number(levels);
    if (!open) return '<div class="pv-line"><span class="pv-tg">▸</span>' + k + lb + '<span class="pv-dim"> … ' + keys.length + ' </span>' + rb + '</div>';
    var out = '<div class="pv-line"><span class="pv-tg">▾</span>' + k + lb + '</div><div class="pv-kids">';
    keys.forEach(function (kk) { out += pvNode(isArr ? null : kk, val[kk], depth + 1, levels); });
    return out + '</div><div class="pv-line"><span class="pv-tg"></span>' + rb + '</div>';
  }
  var CODE_LINES = [
    '<span class="c">// Merge sort — try changing the tab width and wrapping</span>',
    '<span class="k">function</span> <span class="f">mergeSort</span>(items) {',
    '\t<span class="k">if</span> (items.<span class="p">length</span> &lt; <span class="n">2</span>) <span class="k">return</span> items;',
    '\t<span class="k">const</span> mid = items.<span class="p">length</span> &gt;&gt; <span class="n">1</span>;',
    '\t<span class="k">const</span> label = <span class="s">"Sorting " + items.length + " items, split at index " + mid + " (left half first, then right half)"</span>;',
    '\t<span class="k">return</span> <span class="f">merge</span>(<span class="f">mergeSort</span>(items.<span class="f">slice</span>(<span class="n">0</span>, mid)), <span class="f">mergeSort</span>(items.<span class="f">slice</span>(mid)));',
    '}'
  ];
  var SHEET = [['id', 'name', 'city', 'amount'], [101, 'Noa', 'Haifa', '1,240.50'], [102, 'Amir', 'Tel Aviv', '380.00'], [103, 'Lior', 'Eilat', '2,915.25'], [104, 'Dana', 'Jerusalem', '75.10']];

  function renderPreview() {
    var pv = $('setPreview'), note = $('setPreviewNote'), s = settings, scale = s.general.uiScale / 100;
    var sec = s[section] || {};
    pv.removeAttribute('style');
    if (section !== 'general') {
      pv.style.setProperty('--pv-font', sec.fontStack || (section === 'xlsx' || section === 'code' ? DEFAULT_STACK : '"Cascadia Code", Consolas, "Courier New", monospace'));
      pv.style.setProperty('--pv-size', (sec.size * scale) + 'px');
    }
    if (section === 'general') {
      pv.innerHTML = '<div class="pv-window"><div class="pv-bar"><span class="b">Dev Toolkit</span>' +
        '<span class="t on"><i style="background:var(--dot-code)"></i>Code</span><span class="t"><i style="background:var(--dot-json)"></i>JSON</span><span class="t"><i style="background:var(--dot-xlsx)"></i>Sheets</span></div>' +
        '<div class="pv-body"><p>Regular text: the quick brown fox jumps over the lazy dog.</p><p class="dim">Secondary text, hints and timestamps.</p>' +
        '<div class="row"><button class="btn primary" tabindex="-1">Button</button><button class="btn" tabindex="-1">Secondary</button><span class="pv-badge">JSON</span></div></div></div>';
      note.textContent = 'Shows the theme, size and contrast you picked. Currently ' + effectiveTheme() + ' theme' + (s.general.contrast === 'high' ? ', high contrast' : '') + '.';
    } else if (section === 'code') {
      pv.style.setProperty('--pv-lh', sec.lineHeight);
      pv.style.setProperty('--pv-tab', sec.tabSize);
      var html = '<pre class="pv-code' + (sec.wrap ? ' wrap' : '') + '">';
      CODE_LINES.forEach(function (l, i) { html += '<span class="ln">' + (i + 1) + '</span>' + l + '\n'; });
      pv.innerHTML = html + '</pre>';
      note.textContent = 'A sample snippet. Long lines ' + (sec.wrap ? 'wrap' : 'scroll sideways') + '; tabs are ' + sec.tabSize + ' wide.';
    } else if (section === 'json') {
      pv.innerHTML = '<div class="pv-json">' + pvNode(null, SAMPLE_JSON, 0, sec.expand) + '</div>';
      note.textContent = sec.expand === 'all' ? 'Sample tree, fully expanded.' : 'Sample tree opened ' + sec.expand + ' level' + (sec.expand === '1' ? '' : 's') + ' deep.';
    } else if (section === 'xlsx') {
      var pad = { compact: [2, 6], normal: [4, 8], relaxed: [7, 10] }[sec.density];
      pv.style.setProperty('--pv-py', (pad[0] * scale) + 'px');
      pv.style.setProperty('--pv-px', (pad[1] * scale) + 'px');
      var t = '<table class="pv-table"><thead><tr><th class="rn"></th>';
      var hdr = sec.header ? SHEET[0] : ['A', 'B', 'C', 'D'];
      hdr.forEach(function (c) { t += '<th>' + esc(c) + '</th>'; });
      t += '</tr></thead><tbody>';
      SHEET.slice(sec.header ? 1 : 0).forEach(function (r, i) {
        t += '<tr><td class="rn">' + (i + 1) + '</td>';
        r.forEach(function (c) { t += '<td>' + esc(c) + '</td>'; });
        t += '</tr>';
      });
      pv.innerHTML = t + '</tbody></table>';
      note.textContent = sec.header ? 'First row is shown as the header.' : 'Columns are lettered; the first row is regular data.';
    }
    if (section !== 'general' && sec.font !== 'default' && sec.font !== 'system' && !isBundled(sec.font)) {
      var fam = sec.font === 'custom' ? cleanFontText(sec.customFont).split(',')[0].trim() : familyOf(sec.font);
      if (fam && !fontInstalled(fam)) note.textContent += ' “' + fam + '” isn’t installed here, so the default font is shown.';
    }
  }

  function openSettings(sec, scrollTo) {
    if (sec) section = sec;
    pendingScroll = scrollTo || null;
    rememberFocus();
    if (paletteOpen) closePalette(true);
    settingsOpen = true;
    $('settings').hidden = false;
    lockBackground(true);
    window.focus();
    renderNav(); renderControls(); renderPreview();
    var btn = $('setnav-' + section); if (btn) btn.focus();
  }
  function closeSettings(silent) {
    if (!settingsOpen) return;
    settingsOpen = false;
    $('settings').hidden = true;
    if (!silent) restoreFocus(); else lockBackground(paletteOpen);
  }
  $('settingsBtn').addEventListener('click', function () { openSettings(); });
  $('themeToggleBtn').addEventListener('click', toggleTheme);
  $('setClose').addEventListener('click', function () { closeSettings(); });
  $('setDone').addEventListener('click', function () { closeSettings(); });
  $('settings').addEventListener('mousedown', function (e) { if (e.target === $('settings')) closeSettings(); });
  $('settings').addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { e.preventDefault(); closeSettings(); }
    else trapTab(e, $('settings'));
  });
  $('resetSection').addEventListener('click', function () {
    if (!confirm('Reset the “' + SECTIONS.filter(function (s) { return s[0] === section; })[0][1] + '” settings to their defaults?')) return;
    settings[section] = JSON.parse(JSON.stringify(DEFAULTS[section]));
    settings = sanitize(settings); commit();
  });
  $('resetAll').addEventListener('click', function () {
    if (!confirm('Reset all Dev Toolkit settings to their defaults? Your saved files and snippets are not affected.')) return;
    settings = sanitize(JSON.parse(JSON.stringify(DEFAULTS))); commit();
  });

  /* =========================================================================
     Keyboard shortcuts (also forwarded from inside the tool frames)
     ========================================================================= */
  function shortcutFor(e, inMonaco) {
    var primary = isMac ? e.metaKey : e.ctrlKey;
    if (!primary || e.altKey) return null;
    var k = (e.key || '').toLowerCase(), c = e.code || '';   // e.code keeps shortcuts working on non-Latin keyboard layouts
    if (c === 'KeyK' || k === 'k') return inMonaco ? null : 'palette';   // Monaco uses Ctrl+K as a chord prefix (Ctrl+Shift+K deletes a line)
    if (e.shiftKey && (c === 'KeyP' || k === 'p')) return 'palette';
    if (!e.shiftKey && (k === ',' || c === 'Comma')) return 'settings';
    if (!e.shiftKey) { var i = ['Digit1', 'Digit2', 'Digit3', 'Numpad1', 'Numpad2', 'Numpad3'].indexOf(c); if (i >= 0) return 'tab:' + TOOLS[i % 3]; }
    return null;
  }
  function runShortcut(name) {
    if (name === 'palette') { paletteOpen ? closePalette() : openPalette(); }
    else if (name === 'settings') { settingsOpen ? closeSettings() : openSettings(); }
    else if (name.indexOf('tab:') === 0) { closePalette(); closeSettings(true); goTo(name.slice(4)); }
  }
  document.addEventListener('keydown', function (e) {
    var s = shortcutFor(e);
    if (!s) return;
    e.preventDefault();
    runShortcut(s);
  }, true);

  // Keys pressed while a tool has focus never reach this document, so listen inside the tool frame too.
  // (Same origin only; the tools also forward these keys themselves, which covers any other case.)
  function attachFrameKeys(iframe) {
    try {
      var w = iframe.contentWindow;
      if (!w || w.__devToolkitKeys) return;
      w.__devToolkitKeys = true;
      w.addEventListener('keydown', function (e) {
        if (e.defaultPrevented) return;   // the tool's own forwarder already handled this key
        var inMonaco = !!(e.target && e.target.closest && e.target.closest('.monaco-editor'));
        var s = shortcutFor(e, inMonaco);
        if (!s) return;
        e.preventDefault(); e.stopPropagation();
        runShortcut(s);
      }, true);
    } catch (err) { /* cross-origin (e.g. opened from disk): the forwarded messages are used instead */ }
  }

  /* =========================================================================
     Messages from the tool frames
     ========================================================================= */
  window.addEventListener('message', function (e) {
    var known = frames().some(function (f) { return f.contentWindow === e.source; });
    if (!known || (!IS_FILE && e.origin !== SELF_ORIGIN)) return;
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.__devToolkit === 'hello') { hello[d.tool] = true; }
    else if (d.__devToolkit === 'key') {
      var s = shortcutFor({ metaKey: !!d.meta, ctrlKey: !!d.ctrl, altKey: !!d.alt, shiftKey: !!d.shift, key: d.key, code: d.code });
      if (s) runShortcut(s);
    } else if (d.__devToolkit === 'themeToggle') toggleTheme();
    else if (d.__devToolkit === 'reloadAll') resetPanes();
  });

  /* =========================================================================
     Welcome screen: shown on every open until you click / press a key.
     The GitHub links are the exception: they open GitHub and leave the screen up.
     ========================================================================= */
  var splash = $('splash');
  function splashShown() { return !!(splash && splash.isConnected && !splash.classList.contains('hide')); }
  function dismissSplash() {
    if (!splashShown()) return;
    splash.classList.add('hide');
    var el = splash;
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 260);
    if (!overlayOpen()) focusActivePane();
  }
  if (splash && settings.general.splash === false) { splash.parentNode.removeChild(splash); splash = null; }
  if (splash) {
    document.addEventListener('pointerdown', function (e) {
      if (!splashShown()) return;
      if (e.target.closest && e.target.closest('#githubLink, .splash-gh')) return;
      dismissSplash();
    }, true);
    document.addEventListener('keydown', function (e) {
      if (!splashShown()) return;
      if (['Tab', 'Shift', 'Control', 'Alt', 'Meta', 'CapsLock', 'ContextMenu'].indexOf(e.key) >= 0) return;
      dismissSplash();
    }, true);
    window.addEventListener('DOMContentLoaded', function () { try { splash.focus({ preventScroll: true }); } catch (e) {} });
    try { splash.focus({ preventScroll: true }); } catch (e) {}
  }

  /* =========================================================================
     Boot
     ========================================================================= */
  applyGeneral();
  var start = lastTool() || 'code';
  activate(start, { silent: true, noFocus: true });
  function cleanUrl() { if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} } }   // keep the address bar clean
  cleanUrl();
  window.addEventListener('hashchange', cleanUrl);
})();
</script>
</body>
</html>
