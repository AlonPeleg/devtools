<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dev Toolkit</title>
<script>
(function () {
    try {
        var saved = localStorage.getItem('dev_toolkit_theme_v1');
        if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) {}
})();
</script>
<style>
  :root {
    --bg: #1e1e1e;
    --bar-bg: #252526;
    --bar-border: #3c3c3c;
    --tab-fg: #969696;
    --tab-fg-active: #ffffff;
    --tab-active-bg: #1e1e1e;
    --accent: #007acc;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    /* Opposite of the current background, not a themed color — dark mode gets a white
       cursor, light mode gets a black one, so it always pops against the bar. */
    --cursor-color: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-ui);
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }
  #tabbar {
    display: flex;
    align-items: stretch;
    background: var(--bar-bg);
    border-bottom: 1px solid var(--bar-border);
    flex: 0 0 auto;
    padding-left: 8px;
  }
  #tabbar .brand {
    display: flex;
    align-items: center;
    color: #d4d4d4;
    font-weight: 600;
    font-size: 13px;
    padding: 0 14px 0 4px;
    letter-spacing: 0.2px;
    white-space: nowrap;
  }
  #tabbar .brand::after {
    content: "_";
    color: var(--cursor-color);
    text-shadow: 0 0 6px var(--cursor-color);
    margin-left: 2px;
    animation: brandCursorBlink 1.1s steps(1) infinite;
  }
  @keyframes brandCursorBlink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    font-size: 13px;
    color: var(--tab-fg);
    background: transparent;
    border: none;
    border-right: 1px solid var(--bar-border);
    cursor: pointer;
    position: relative;
    top: 1px;
    font-family: inherit;
  }
  .tab:hover {
    color: #d4d4d4;
    background: rgba(255,255,255,0.03);
  }
  .tab.active {
    color: var(--tab-fg-active);
    background: var(--tab-active-bg);
    border-bottom: 1px solid var(--tab-active-bg);
  }
  .tab.active::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
  }
  .tab .dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex: 0 0 auto;
  }
  .tab[data-tool="code"] .dot { background: #3ba7ff; }
  .tab[data-tool="json"] .dot { background: #e2b93d; }
  .tab[data-tool="xlsx"] .dot { background: #3fae5a; }

  #panes {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: var(--bg);
  }
  .pane {
    position: absolute;
    inset: 0;
    display: none;
  }
  .pane.active {
    display: block;
  }
  .pane iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #fff;
  }
  .placeholder {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #6a6a6a;
    font-size: 13px;
  }
  #githubLink {
    margin-left: auto;
    align-self: center;
    margin-right: 2px;
    color: var(--tab-fg);
    display: flex;
    align-items: center;
    padding: 6px;
    border-radius: 4px;
    text-decoration: none;
  }
  #githubLink:hover {
    background: rgba(128,128,128,0.18);
    color: var(--tab-fg-active);
  }
  #githubLink:focus-visible,
  #themeToggleBtn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  #githubLink svg {
    width: 16px;
    height: 16px;
    display: block;
  }
  #themeToggleBtn {
    align-self: center;
    margin-right: 10px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: var(--tab-fg);
    display: flex;
    align-items: center;
    padding: 6px;
    border-radius: 4px;
  }
  #themeToggleBtn:hover {
    background: rgba(128,128,128,0.18);
    color: var(--tab-fg-active);
  }
  #themeToggleBtn svg {
    width: 15px;
    height: 15px;
    display: block;
  }

  /* ---------- Light theme ---------- */
  html[data-theme="light"] {
    --bg: #ffffff;
    --bar-bg: #f3f3f3;
    --bar-border: #d4d4d4;
    --tab-fg: #5f5f5f;
    --tab-fg-active: #000000;
    --tab-active-bg: #ffffff;
    --accent: #086bb3;
    --cursor-color: #000000;
  }
  html[data-theme="light"] .placeholder { color: #6b6b6b; }
  html[data-theme="light"] .brand { color: #3a3a3a; }
  html[data-theme="light"] .tab:hover { color: #1e1e1e; }
</style>
</head>
<body>
<div id="app">
  <div id="tabbar">
    <div class="brand">Dev Toolkit</div>
    <button class="tab active" data-tool="code"><span class="dot"></span>Code Viewer &amp; Compare</button>
    <button class="tab" data-tool="json"><span class="dot"></span>JSON / XML Viewer &amp; Compare</button>
    <button class="tab" data-tool="xlsx"><span class="dot"></span>CSV / XLSX Viewer</button>
    <a id="githubLink" href="https://github.com/AlonPeleg/devtools" target="_blank" rel="noopener noreferrer" title="GitHub repo" aria-label="GitHub profile">
      <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
    <button id="themeToggleBtn" title="Toggle light / dark theme (applies to all panes)" onclick="toggleTheme()">
      <span id="themeToggleIcon" style="display:flex"></span>
    </button>
  </div>
  <div id="panes">
    <div class="pane active" data-tool="code">
      <div class="placeholder">Loading Code Viewer…</div>
    </div>
    <div class="pane" data-tool="json">
      <div class="placeholder">Loading JSON Viewer…</div>
    </div>
    <div class="pane" data-tool="xlsx">
      <div class="placeholder">Loading XLSX Viewer…</div>
    </div>
  </div>
</div>

<script>
(function () {
    var THEME_KEY = 'dev_toolkit_theme_v1';
    var moonIcon = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M6.5 1.3a6.7 6.7 0 1 0 8.2 8.2A6.95 6.95 0 0 1 6.5 1.3z"/></svg>';
    var sunIcon = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="8" r="3.2" fill="currentColor" stroke="none"/><path d="M8 0.7v2.1M8 13.2v2.1M0.7 8h2.1M13.2 8h2.1M2.8 2.8l1.5 1.5M11.7 11.7l1.5 1.5M2.8 13.2l1.5-1.5M11.7 4.3l1.5-1.5"/></svg>';

    function updateToggleIcon(theme) {
        var icon = document.getElementById('themeToggleIcon');
        var btn = document.getElementById('themeToggleBtn');
        if (icon) icon.innerHTML = theme === 'light' ? sunIcon : moonIcon;
        if (btn) btn.title = theme === 'light' ? 'Switch all panes to dark theme' : 'Switch all panes to light theme';
    }

    window.getCurrentTheme = function () {
        return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    };

    window.sendThemeToIframe = function (iframe, theme) {
        try {
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage({ __devToolkitThemeSet: true, theme: theme }, '*');
            }
        } catch (e) {}
    };

    function applyTheme(theme, broadcast) {
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
        updateToggleIcon(theme);
        if (broadcast) {
            document.querySelectorAll('#panes iframe').forEach(function (iframe) {
                window.sendThemeToIframe(iframe, theme);
            });
        }
    }

    window.toggleTheme = function () {
        var next = window.getCurrentTheme() === 'light' ? 'dark' : 'light';
        applyTheme(next, true);
        try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    };

    updateToggleIcon(window.getCurrentTheme());
})();
</script>
<script>
(function () {
  var files = { code: 'code.html', json: 'json.html', xlsx: 'xlsx.html' };
  var loaded = { code: false, json: false, xlsx: false };

  function loadPane(tool) {
    if (loaded[tool]) return;
    var pane = document.querySelector('.pane[data-tool="' + tool + '"]');
    var iframe = document.createElement('iframe');
    iframe.src = files[tool] + '?theme=' + encodeURIComponent(window.getCurrentTheme());
    iframe.setAttribute('title', tool + ' tool');
    iframe.addEventListener('load', function () {
      window.sendThemeToIframe(iframe, window.getCurrentTheme());
    });
    pane.innerHTML = '';
    pane.appendChild(iframe);
    loaded[tool] = true;
  }

  function activate(tool) {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.getAttribute('data-tool') === tool);
    });
    document.querySelectorAll('.pane').forEach(function (p) {
      p.classList.toggle('active', p.getAttribute('data-tool') === tool);
    });
    loadPane(tool);
  }

  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      activate(t.getAttribute('data-tool'));
    });
  });

  // Load the first tab immediately.
  activate('code');
})();
</script>
</body>
</html>
